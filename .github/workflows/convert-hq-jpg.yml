name: Convert HQ vignette to JPG

on:
  push:
    paths:
      - '.github/workflows/convert-hq-jpg.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Convert WebP to high quality JPG
        run: |
          python - <<'PY'
          from PIL import Image
          src='assets/episodes/2026-09-23-meloni-fine-legislatura-hq.webp'
          dst='assets/episodes/2026-09-23-meloni-fine-legislatura-hq.jpg'
          im=Image.open(src).convert('RGB')
          im.save(dst,'JPEG',quality=94,optimize=True,progressive=True)
          print(im.size)
          PY
      - name: Commit JPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/episodes/2026-09-23-meloni-fine-legislatura-hq.jpg
          git commit -m "Add compatible HQ JPG vignette"
          git push
