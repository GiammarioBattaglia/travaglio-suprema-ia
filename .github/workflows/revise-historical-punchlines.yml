name: Revise Historical Punchlines

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/revise-historical-punchlines.yml'
      - 'scripts/revise-historical-punchlines.mjs'
      - '.revision-trigger'

permissions:
  contents: write

concurrency:
  group: historical-punchline-revision
  cancel-in-progress: false

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated image renderer
        run: |
          npm --silent init -y >/dev/null 2>&1
          npm --silent install --no-save --no-package-lock sharp@0.34.4 >/dev/null 2>&1
      - name: Generate all revised images transactionally
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2.5-sunburst
        run: node scripts/revise-historical-punchlines.mjs
      - name: Commit revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes data/site.json data/episodes.json episodio archive/index.html index.html assets/episodes
          git diff --cached --quiet && exit 0
          git commit -m "Revise historical satire punchlines"
          git pull --rebase origin main
          git push origin main
