name: Autonomous Daily Publish

on:
  push:
    paths:
      - 'incoming/*.json'
      - '.github/workflows/autonomous-publish.yml'
      - 'scripts/publish-autonomous.mjs'
      - 'scripts/render-caricature.mjs'
      - 'scripts/test-render-caricature.mjs'
      - 'scripts/verify-production.mjs'
  schedule:
    - cron: '15 10 * * *' # Controllo di recupero: la redazione quotidiana resta nell'automazione ChatGPT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autonomous-daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated image renderer
        run: |
          npm --silent init -y >/dev/null 2>&1
          npm --silent install --no-save --no-package-lock sharp@0.34.4 >/dev/null 2>&1
      - name: Validate renderer with offline fixture
        run: node scripts/test-render-caricature.mjs
      - name: Check image generation configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "OPENAI_IMAGE_AVAILABLE=true"
          else
            echo "OPENAI_IMAGE_AVAILABLE=false — fallback SVG only"
          fi
      - name: One-shot upgrade current fallback to API JPEG
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2.5-sunburst
        run: node scripts/upgrade-current-image.mjs
      - name: Validate and publish autonomous episode
        id: publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2.5-sunburst
        run: node scripts/publish-autonomous.mjs
      - name: Commit generated episode and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes data/site.json data/episodes.json episodio archive/index.html assets/episodes
          if git diff --cached --quiet; then
            echo "No autonomous publication changes"
          else
            git commit -m "Publish autonomous daily episode"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Verify public production after deployment
        if: steps.publish.outputs.slug != ''
        env:
          PUBLISHED_SLUG: ${{ steps.publish.outputs.slug }}
        run: node scripts/verify-production.mjs
