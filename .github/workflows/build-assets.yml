name: Build PWA assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/icon-source.svg'
      - 'assets/social-source.svg'
      - '.github/workflows/build-assets.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render PNG and JPG assets
        shell: bash
        run: |
          npm --silent init -y >/dev/null 2>&1
          npm --silent install sharp@0.33.5 >/dev/null 2>&1
          node <<'NODE'
          const sharp = require('sharp');
          (async () => {
            const icon='assets/icon-source.svg';
            await sharp(icon).resize(180,180).png({compressionLevel:9}).toFile('assets/icon-180.png');
            await sharp(icon).resize(192,192).png({compressionLevel:9}).toFile('assets/icon-192.png');
            await sharp(icon).resize(512,512).png({compressionLevel:9}).toFile('assets/icon-512.png');
            await sharp(icon).resize(512,512).png({compressionLevel:9}).toFile('assets/icon-maskable.png');
            await sharp('assets/social-source.svg').resize(1200,630).jpeg({quality:88, progressive:true}).toFile('assets/social.jpg');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          rm -f package.json package-lock.json
      - name: Commit rendered assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon-180.png assets/icon-192.png assets/icon-512.png assets/icon-maskable.png assets/social.jpg
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "Render production PWA assets"
            git push
          fi
